name: Build GovtSetu APK

# Builds the Android app WITHOUT needing Android Studio installed anywhere.
# GitHub's own servers (free, no cost for a public repo) do the actual
# compiling — you just push code here and download the finished .apk.
#
# - Runs on every push to main, and whenever you trigger it manually from
#   the "Actions" tab ("Run workflow" button).
# - Always builds a DEBUG apk (installable immediately, works with no setup
#   — good for your own testing).
# - Also builds a signed RELEASE apk, but only once you've added the 4
#   signing secrets listed below — until then that step is skipped and
#   only the debug apk is produced. See ANDROID-APP-SETUP.txt for how to
#   create those secrets (one-time, ~5 minutes).
# - If google-services.json has been added as a secret (push notifications
#   set up), it's written into place before building so Firebase works in
#   the compiled app. If not added yet, the build still succeeds — push
#   notifications just won't do anything until it is.
# - On a push to main with a working release build, publishes/updates a
#   GitHub Release tagged "latest" with the APK attached, so you always
#   have one stable link to give students
#   (https://github.com/<you>/<repo>/releases/latest/download/govtsetu.apk)
#   — see ANDROID-APP-SETUP.txt for making the repo public so that link
#   works for anyone without a GitHub login.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install

      - name: Write google-services.json (Firebase push notifications)
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        if: ${{ env.GOOGLE_SERVICES_JSON_B64 != '' }}
        run: echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: govtsetu-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # ── Signed release build — only runs once the 4 secrets below exist ──
      - name: Write release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Build signed release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: cp android/app/build/outputs/apk/release/app-release.apk govtsetu.apk

      - name: Upload release APK (build artifact)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: govtsetu-release-apk
          path: govtsetu.apk

      - name: Publish / update "latest" GitHub Release with the APK
        if: ${{ github.ref == 'refs/heads/main' && env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: GovtSetu (latest build)
          body: Automatically built from the latest code on main. This is always the newest version — share this one link with students.
          artifacts: govtsetu.apk
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
