<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>GovtSetu</title>
<style>
  html,body{margin:0;height:100%;background:#0f172a;color:#e2e8f0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center}
  .box{padding:24px}
  .spinner{width:40px;height:40px;margin:0 auto 18px;border:4px solid #334155;border-top-color:#38bdf8;border-radius:50%;animation:spin 0.9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  h1{font-size:20px;margin:0 0 6px}
  p{color:#94a3b8;font-size:14px;margin:0 0 16px}
  button{background:#38bdf8;color:#0f172a;border:none;border-radius:8px;padding:10px 20px;font-size:14px;font-weight:600;display:none}
</style>
</head>
<body>
  <div class="box">
    <div class="spinner" id="sp"></div>
    <h1>GovtSetu</h1>
    <p id="msg">Connecting…</p>
    <button id="retry" onclick="location.reload()">Retry</button>
  </div>
  <script>
    // This local page is only ever seen if the live site fails to load
    // (no internet, or deltacoresystems.in is unreachable). Capacitor's
    // config points the app straight at the live site normally, so in
    // everyday use a student never sees this screen.
    setTimeout(function () {
      document.getElementById('sp').style.display = 'none';
      document.getElementById('msg').textContent = navigator.onLine
        ? "Couldn't reach GovtSetu. Check your connection and try again."
        : "You're offline. Connect to the internet and try again.";
      document.getElementById('retry').style.display = 'inline-block';
    }, 6000);
  </script>
</body>
</html>
